# docker-compose.yml — Run the entire app with one command: docker-compose up
#
# Services defined here:
#   backend   — FastAPI Python app
#   frontend  — React app (served by Vite in dev, Nginx in prod)
#   db        — PostgreSQL (upgrade from SQLite when you're ready)
#
# For now (dev), you probably won't use Docker — just run backend and frontend separately.
# But understanding this file is key for deployment.

version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://linkdrop:linkdrop_pass@db:5432/linkdrop}
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-real-secret-in-production}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linkdrop
      POSTGRES_PASSWORD: linkdrop_pass
      POSTGRES_DB: linkdrop
    # For production security, do not expose port 5432 to the host network.
    # It is accessible internally to the backend via the container name "db".
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkdrop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

